# Service para Multiagent
kind: Service
apiVersion: v1
metadata:
  name: hml-senac-agente-orquestrador-service
  namespace: hml-senac-orquestrator-chatbotx
  labels:
    app: hml-senac-agente-orquestrador
spec:
  ports:
    - name: 3000-tcp
      protocol: TCP
      port: 3000
      targetPort: 3000
  internalTrafficPolicy: Cluster
  type: ClusterIP
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
  selector:
    app: hml-senac-agente-orquestrador
